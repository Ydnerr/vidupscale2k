name: Convert Video to 2K

on:
  workflow_dispatch:
    inputs:
      file:
        description: "Opsional: path 1 file. Kosongkan = proses semua video di input/"
        required: false
        default: ""
      mode:
        description: "keep = rasio asli, pad = kanvas 2K penuh + bar hitam"
        type: choice
        options:
          - keep
          - pad
        default: keep
      crf:
        description: "Kualitas (16 = bagus, 23 = kecil)"
        required: true
        default: "18"

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Convert ke 2K
        env:
          FILE: ${{ inputs.file }}
          MODE: ${{ inputs.mode }}
          CRF: ${{ inputs.crf }}
        run: |
          mkdir -p output

          convert_one() {
            IN="$1"
            NAME="$(basename "${IN%.*}")"
            OUT="output/${NAME}_2k.mp4"

            W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$IN")
            H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$IN")
            echo "==> $IN (${W}x${H})"

            if [ "$MODE" = "keep" ]; then
              VF="scale='if(gt(iw,ih),-2,1440)':'if(gt(iw,ih),1440,-2)':flags=lanczos"
            else
              if [ "$W" -ge "$H" ]; then CW=2560; CH=1440; else CW=1440; CH=2560; fi
              VF="scale=${CW}:${CH}:force_original_aspect_ratio=decrease:flags=lanczos,pad=${CW}:${CH}:(ow-iw)/2:(oh-ih)/2:black"
            fi

            ffmpeg -y -i "$IN" -vf "$VF,setsar=1" \
              -c:v libx264 -crf "$CRF" -preset medium \
              -pix_fmt yuv420p -c:a aac -b:a 192k -movflags +faststart \
              "$OUT"

            ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$OUT"
          }

          if [ -n "$FILE" ]; then
            convert_one "$FILE"
          else
            COUNT=0
            while IFS= read -r -d '' f; do
              convert_one "$f"
              COUNT=$((COUNT+1))
            done < <(find input -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.mkv' -o -iname '*.webm' -o -iname '*.avi' \) -print0)

            if [ "$COUNT" -eq 0 ]; then
              echo "Tidak ada video di folder input/"
              exit 1
            fi
          fi

      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: video-2k
          path: output/*.mp4
